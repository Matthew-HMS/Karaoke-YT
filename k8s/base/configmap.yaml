apiVersion: v1
kind: ConfigMap
metadata:
  name: singalong-config
  namespace: karaoke
data:
  # Non-secret runtime config. Secrets (AUTH_*, YOUTUBE_API_KEY) come from the
  # `singalong-secrets` Secret created out-of-band — see k8s/README.md.
  NODE_ENV: "production"
  DB_PATH: "/data/singalong.db"
  YTDLP_PATH: "/usr/local/bin/yt-dlp"
  # Where the melody-reference contours used by scoring get generated. With "1"
  # the app only records which videos still need one and accepts finished
  # contours from an external helper, authenticated by REFERENCE_INGEST_TOKEN in
  # the Secret. Set "0" to generate them in-cluster instead.
  REFERENCE_OFFLOAD: "1"
  # yt-dlp settings for the in-cluster generation path; ignored while offloading.
  YTDLP_COOKIES: "/secrets/yt/cookies.txt"
  YTDLP_EXTRACTOR_ARGS: "youtube:player_client=android"
  YTDLP_PROXY: ""
  # Public origin — must match the host Auth.js issues OAuth redirects for.
  AUTH_URL: "https://sho-karaoke.duckdns.org"
  AUTH_TRUST_HOST: "true"
